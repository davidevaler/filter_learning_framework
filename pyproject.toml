[project]
name = "filter-learning-framework"
version = "0.2.0"
description = "Automatic search of an image filter pipeline to reduce the HCM-LCM domain shift in malaria detection with YOLO"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0.2",
    "opencv-python>=4.10",
    "optuna>=4.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "torch>=2.5.1",
    "tqdm>=4.66",
    "typing-extensions>=4.12",
    "ultralytics>=8.4.9",
]

[project.optional-dependencies]
dashboard = ["optuna-dashboard>=0.17"]